<!--
  Lockup Bookit. Fuente del dibujo: el maestro de
  `Documents/Data Apps/Bookit/Logos/logo_bookit_completo.svg` — misma geometría,
  verificada path por path.

  Dos correcciones sobre el maestro, y conviene no deshacerlas al re-exportar:

  1. Los huecos de la `B` y de las dos `o` están CALADOS con `fill-rule="evenodd"`.
     En el maestro están TAPADOS con tres casi-blancos distintos (#FEFDFD, #FDFDFD,
     #FEFEFD), o sea que el logo sólo funciona sobre blanco: sobre cualquier otro
     fondo los tapones se ven. Es el "la O rellenada".
  2. Un solo naranja, y es el del manual. El maestro trae dos (#FD8003 en casi
     todo y #FD8102 sólo en el punto de la `i`), y ninguno es el #FD7D03 que
     `docs/MARCA.md` declara canónico.

  La tinta sale en `currentColor`: el color lo pone quien lo usa.
  En React NO se consume este archivo, se usa `components/Wordmark.tsx`.
-->
