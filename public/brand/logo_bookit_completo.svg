<!--
  Lockup Bookit. Export del maestro
  `Documents/Data Apps/Bookit/Logos/logo_bookit_completo.svg`, con la palabra
  convertida a contornos en Illustrator (Texto -> Crear contornos).

  Dos cosas que se cambian respecto del export y no hay que deshacer:

  1. La tinta sale en `currentColor`. El export la deja sin `fill`, o sea negra
     fija, y así el lockup es invisible sobre el lienzo de marca.
  2. Un solo naranja, y es el del manual. El export trae `#FD8003`; el canónico
     es `#FD7D03` (`docs/MARCA.md`).

  Los huecos de la `B` y de las dos `o` son subpaths del mismo path compuesto,
  o sea que quedan calados con el `fill-rule` por defecto. No hace falta
  `evenodd`: verificado sobre ambar y sobre `marca-profunda`.

  En React NO se consume este archivo, se usa `components/Wordmark.tsx`.
-->
